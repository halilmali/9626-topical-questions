name: One-time sync databases from Render

on:
  push:
    paths:
      - ".github/workflows/sync-render-databases.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download live databases
        run: |
          curl --fail --silent --show-error --retry 5 --retry-delay 5             https://nine626-topical-questions.onrender.com/questions_db.json             --output questions_db.json
          curl --fail --silent --show-error --retry 5 --retry-delay 5             https://nine626-topical-questions.onrender.com/questions_db_v2.json             --output questions_db_v2.json

      - name: Validate database files
        run: |
          jq empty questions_db.json
          jq empty questions_db_v2.json
          test "$(jq '.questions | length' questions_db.json)" -eq 1445
          test "$(jq '.questions | length' questions_db_v2.json)" -eq 1445

      - name: Commit synchronized databases
        run: |
          if git diff --quiet -- questions_db.json questions_db_v2.json; then
            echo "Databases are already synchronized."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add questions_db.json questions_db_v2.json
          git commit -m "Sync question database changes from Render"
          git push
